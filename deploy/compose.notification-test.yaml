# Disposable integration stack only. Pair with compose.test.yaml.
x-destinations: &destinations '{"https://notify-fixture.bountydeck.test:8443":["192.168.247.10"]}'
services:
  application:
    environment:
      WEBHOOK_DESTINATIONS: *destinations
  worker:
    environment:
      WEBHOOK_DESTINATIONS: *destinations
      SMTP_FROM: fixture@example.invalid
      SMTP_ALLOW_PLAINTEXT: "true"
    networks: [worker, database, notification_test]
  notification-fixture:
    security_opt: [no-new-privileges:true]
    image: node:26.13.1-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    user: node
    command: ["node", "/fixture.mjs"]
    secrets: [internal_ca, notification_test_key, notification_test_hmac]
    volumes:
      - ./deploy/notification-fixture.mjs:/fixture.mjs:ro
    networks:
      notification_test:
        ipv4_address: 192.168.247.10
        aliases: [notify-fixture.bountydeck.test]
networks:
  notification_test:
    internal: true
    ipam:
      config:
        - subnet: 192.168.247.0/24
secrets:
  internal_ca:
    file: ./secrets/notification_test_cert.pem
  smtp_url:
    file: ./secrets/notification_test_smtp
  notification_test_key:
    file: ./secrets/notification_test_key.pem
  notification_test_hmac:
    file: ./secrets/notification_test_hmac
